services:
  fems-backup-manager:
    build: .
    container_name: fems-backup-manager
    restart: always
    ports:
      - "5050:5050"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/backups/FEMS_Backup:/var/backups/FEMS_Backup
      - ./config.json:/app/config.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PYTHONUNBUFFERED=1
